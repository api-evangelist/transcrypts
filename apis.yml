name: TransCrypts
description: 'TransCrypts is a blockchain-based identity and credential verification
  platform that lets individuals own, encrypt, and share verified records — employment
  and income history, background checks, and (with HIPAA certification) health and
  education credentials — directly with employers, background checkers, and other verifiers.
  Encrypted data is stored off-chain while cryptographic hashes are anchored on-chain,
  so users can prove authenticity without exposing personal data. The company reports
  5M+ verifications across 4M+ users and 450+ enterprise clients, and connects to HR
  and payroll systems such as ADP, BambooHR, and Namely. It raised a $15M seed round
  led by Pantera Capital, with Techstars, Lightspeed Faction, Alpha Edison, Motley
  Fool Ventures, Mark Cuban, and Protocol Labs participating.'
